function saveCart(){localStorage.setItem('sk_cart',JSON.stringify(cart));document.getElementById('cc').textContent=cart.reduce((a,b)=>a+b.q,0)}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P=id=>S.products.find(p=>p.id===id);
const C=id=>S.cats.find(c=>c.id===id)||{hi:'',en:'',icon:'📦'};
const pname=p=>L(p.hi,p.en);
const money=n=>'₹'+(Math.round(n*100)/100);
const hasPrice=p=>p.price!=null&&p.price!==''&&+p.price>0;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function waNum(){return (S.settings.wa||'').replace(/\D/g,'').replace(/^0+/,'').replace(/^(\d{10})$/,'91$1')}
function waLink(text){const n=waNum();return 'https://wa.me/'+n+'?text='+encodeURIComponent(text)}
function needWA(){if(!waNum()){toast(L('दुकानदार ने अभी WhatsApp नंबर नहीं डाला','Owner has not set WhatsApp number yet'));return true}return false}

/* ================= ROUTER ================= */
let route=['home'],qs='',catF='',cur;
function go(r){location.hash='#'+r}
window.addEventListener('hashchange',render);
function doSearch(v){qs=v.trim();catF='';if(route[0]!=='shop'){go('shop')}else render()}
function toggleLang(){lang=lang==='hi'?'en':'hi';localStorage.setItem('sk_lang',lang);render()}

/* ================= CARDS ================= */
function pimg(p,big){const c=C(p.cat);return p.img?`<img src="${esc(p.img)}" alt="${esc(pname(p))}" loading="lazy">`:`<span ${big?'style="font-size:96px"':''}>${c.icon}</span>`}
function priceHTML(p){if(!hasPrice(p))return `<span class="pr"><em>${T('ask')}</em></span>`;
 const d=p.mrp&&+p.mrp>+p.price?Math.round((1-p.price/p.mrp)*100):0;return `<div class="pr">${money(p.price)}${d?`<s>${money(p.mrp)}</s>`:''}</div>`}
function card(p){const d=hasPrice(p)&&p.mrp&&+p.mrp>+p.price?Math.round((1-p.price/p.mrp)*100):0;
 return `<div class="card"><div class="pimg" onclick="go('product/${p.id}')">${pimg(p)}${d?`<span class="off">${d}% OFF</span>`:''}</div>
 <div class="pb"><div class="pn" onclick="go('product/${p.id}')">${esc(pname(p))}</div><div class="pe">${esc(L(p.en,p.hi))}${p.brand?' · '+esc(p.brand):''}${p.wt?' · '+esc(p.wt):''}</div>
 ${priceHTML(p)}<div class="stk ${p.stock?'in':'out'}">${p.stock?'✔ '+T('in'):'✖ '+T('out')}</div>
 <div class="acts"><button class="btn b-red b-sm" ${p.stock?'':'disabled style="opacity:.4"'} onclick="addCart('${p.id}')">${T('add')}</button>
 <button class="btn b-blue b-sm" ${p.stock?'':'disabled style="opacity:.4"'} onclick="buyNow('${p.id}')">${T('buy')}</button></div></div></div>`}
const vis=()=>S.products.filter(p=>p.on);
function addCart(id,q=1,silent){const i=cart.find(x=>x.id===id);if(i)i.q+=q;else cart.push({id,q});saveCart();if(!silent)toast('✔ '+L('कार्ट में जोड़ा','Added to cart'))}
function buyNow(id){addCart(id,1,true);go('checkout')}
function chg(id,d){const i=cart.find(x=>x.id===id);if(!i)return;i.q+=d;if(i.q<1)cart=cart.filter(x=>x.id!==id);saveCart();render()}
function rm(id){cart=cart.filter(x=>x.id!==id);saveCart();render()}

/* ================= PAGES ================= */
function pHome(){
 const f=vis().filter(p=>p.feat).slice(0,8),b=vis().filter(p=>p.best).slice(0,8),o=vis().filter(p=>hasPrice(p)&&p.mrp&&+p.mrp>+p.price).slice(0,8),n=vis().filter(p=>p.isnew).slice(0,8);
 const sec=(t,a)=>a.length?`<section><div class="wrap"><h2 class="t">${t}</h2><div class="grid">${a.map(card).join('')}</div></div></section>`:'';
 return `<div class="hero"><div class="wrap"><h1>${T('heroT')}</h1><p>${T('heroP')}</p>
 <a class="btn b-gold" onclick="go('shop')">${T('shop')} →</a> <a class="btn b-wa" onclick="waGeneral()">${T('wa')}</a></div></div>
 <section><div class="wrap"><h2 class="t">${T('cats')}</h2>${catGrid()}</div></section>
 ${sec(T('feat'),f)}${sec(T('best'),b)}${sec(T('offers'),o)}${sec(T('new'+'a'),n)}
 <section><div class="wrap info"><div class="box"><h3>${T('deliv')}</h3>${T('dinfo')}</div><div class="box"><h3>${T('pick')}</h3>${T('pinfo')}</div><div class="box"><h3>📞 ${L('कस्टमर सपोर्ट','Customer support')}</h3>${T('sinfo')}</div></div></section>`}
function catGrid(){return `<div class="cats">${S.cats.map(c=>`<div class="cat" onclick="catF='${c.id}';qs='';go('shop')"><span>${c.icon}</span>${esc(L(c.hi,c.en))}</div>`).join('')}</div>`}
function waGeneral(){if(needWA())return;location.href=waLink(L('नमस्ते, मुझे शिवा किराना स्टोर से सामान मंगवाना है।','Hello, I want to order from Shiva Kirana Store.'))}

function pShop(){
 let a=vis();if(catF)a=a.filter(p=>p.cat===catF);
 if(qs){const s=qs.toLowerCase();a=a.filter(p=>(p.hi+' '+p.en+' '+p.brand+' '+C(p.cat).hi+' '+C(p.cat).en).toLowerCase().includes(s))}
 return `<section><div class="wrap"><h2 class="t">${T('shop')}</h2>
 <div class="pills" style="margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap"><span class="pill ${catF?'':'on'}" onclick="catF='';render()">${L('सभी','All')}</span>${S.cats.map(c=>`<span class="pill ${catF===c.id?'on':''}" style="white-space:nowrap" onclick="catF='${c.id}';render()">${c.icon} ${esc(L(c.hi,c.en))}</span>`).join('')}</div>
 ${a.length?`<div class="grid">${a.map(card).join('')}</div>`:`<p>${T('nothing')}</p>`}</div></section>`}
function pCats(){return `<section><div class="wrap"><h2 class="t">${T('cats')}</h2>${catGrid()}</div></section>`}
function pProd(id){const p=P(id);if(!p)return pShop();
 return `<section><div class="wrap"><div class="card"><div class="pimg" style="aspect-ratio:4/3;cursor:default">${pimg(p,1)}</div><div class="pb" style="padding:16px">
 <h2 style="color:var(--red-d)">${esc(pname(p))}</h2><div class="pe">${esc(L(p.en,p.hi))}</div>
 <div class="pe">${L('श्रेणी','Category')}: ${esc(L(C(p.cat).hi,C(p.cat).en))}${p.brand?' · '+L('ब्रांड','Brand')+': '+esc(p.brand):''}${p.wt?' · '+esc(p.wt):''}</div>
 <div style="font-size:24px">${priceHTML(p)}</div><div class="stk ${p.stock?'in':'out'}">${p.stock?'✔ '+T('in'):'✖ '+T('out')}</div>
 <p style="margin:8px 0">${esc(p.desc)||L('शुद्ध और ताज़ा सामान। ज़्यादा जानकारी के लिए दुकान से पूछें।','Pure and fresh. Ask the store for more details.')}</p>
 <div class="acts"><button class="btn b-red" ${p.stock?'':'disabled'} onclick="addCart('${p.id}')">${T('add')}</button><button class="btn b-blue" ${p.stock?'':'disabled'} onclick="buyNow('${p.id}')">${T('buy')}</button></div></div></div></div></section>`}

function totals(deliv){
 let sub=0,unp=0;cart.forEach(i=>{const p=P(i.id);if(!p)return;if(hasPrice(p))sub+=p.price*i.q;else unp++});
 let d=0;if(deliv==='home'){d=+S.settings.delivery||0;if(+S.settings.freeAbove>0&&sub>=+S.settings.freeAbove)d=0}
 return{sub,unp,d,total:sub+d}}
function pCart(){
 cart=cart.filter(i=>P(i.id));
 if(!cart.length)return `<section><div class="wrap"><h2 class="t">${T('cart')}</h2><p>${T('empty')}</p><br><a class="btn b-red" onclick="go('shop')">${T('shop')}</a></div></section>`;
 const t=totals('home');
 return `<section><div class="wrap"><h2 class="t">${T('cart')}</h2>${cart.map(i=>{const p=P(i.id);return `<div class="row"><div class="th">${p.img?`<img src="${esc(p.img)}">`:C(p.cat).icon}</div><div class="m"><b>${esc(pname(p))}</b><div class="pe">${p.wt?esc(p.wt):''}</div>${priceHTML(p)}</div>
 <div><div class="qty"><button onclick="chg('${p.id}',-1)">−</button><b>${i.q}</b><button onclick="chg('${p.id}',1)">+</button></div><div style="text-align:center;margin-top:4px"><a onclick="rm('${p.id}')" style="color:var(--red);font-size:14px">🗑 ${L('हटाएं','Remove')}</a></div></div></div>`}).join('')}
 <div class="sum"><div><span>${T('sub')}</span><b>${money(t.sub)}</b></div><div><span>${T('del')}</span><span>${L('चेकआउट पर','at checkout')}</span></div>${t.unp?`<div class="pe" style="display:block">⚠ ${T('pricepending')}</div>`:''}<div class="tot"><span>${T('total')}</span><span>${money(t.sub)}</span></div></div>
 <br><a class="btn b-red b-full" onclick="go('checkout')">${T('checkout')} →</a></div></section>`}

let co={mode:'home',pay:'whatsapp'};
function pCheckout(){
 if(!cart.length)return pCart();
 const st=S.settings,t=totals(co.mode);
 return `<section><div class="wrap"><h2 class="t">${T('checkout')}</h2>
 <label>${L('आपका नाम','Your name')} *</label><input id="cn" autocomplete="name">
 <label>${L('मोबाइल नंबर','Mobile number')} *</label><input id="cm" inputmode="numeric" maxlength="10" autocomplete="tel">
 <div class="pills" style="margin:12px 0"><span class="pill ${co.mode==='home'?'on':''}" onclick="co.mode='home';keep();render()">${T('deliv')}</span><span class="pill ${co.mode==='pick'?'on':''}" onclick="co.mode='pick';keep();render()">${T('pick')}</span></div>
 ${co.mode==='home'?`<label>${L('डिलीवरी पता','Delivery address')} *</label><textarea id="ca" rows="2"></textarea>
 <div class="two"><div><label>${L('इलाका','Area')}</label><input id="car"></div><div><label>PIN code *</label><input id="cp" inputmode="numeric" maxlength="6"></div></div>
 <div class="pe">⏱ ${L('अनुमानित समय','Estimated time')}: ${esc(st.eta)}</div>`:`<div class="note">${esc(st.address)||L('दुकान का पता संपर्क पेज पर देखें','See store address on Contact page')}</div>`}
 <label>${L('ऑर्डर नोट्स','Order notes')}</label><textarea id="cno" rows="2"></textarea>
 <label>${L('पेमेंट तरीका','Payment method')}</label>
 <div class="pills"><span class="pill ${co.pay==='whatsapp'?'on':''}" onclick="co.pay='whatsapp';keep();render()">${L('WhatsApp पर कन्फर्म','Confirm on WhatsApp')}</span>
 ${st.cod?`<span class="pill ${co.pay==='cod'?'on':''}" onclick="co.pay='cod';keep();render()">${L('कैश ऑन डिलीवरी','Cash on delivery')}</span>`:''}
 ${st.upi?`<span class="pill ${co.pay==='upi'?'on':''}" onclick="co.pay='upi';keep();render()">UPI</span>`:''}</div>
 ${co.pay==='upi'?`<div class="note">${L('ऑर्डर के बाद UPI ऐप खुलेगा। पेमेंट दुकानदार अपने खाते में देखकर कन्फर्म करेंगे। अपना UPI PIN कभी किसी को न बताएं।','UPI app will open after order. The owner confirms payment in their own account. Never share your UPI PIN.')}</div>`:''}
 <br><div class="sum"><div><span>${T('sub')}</span><b>${money(t.sub)}</b></div><div><span>${T('del')}</span><span>${co.mode==='pick'||t.d===0?T('free'):money(t.d)}</span></div>${t.unp?`<div class="pe" style="display:block">⚠ ${T('pricepending')}</div>`:''}<div class="tot"><span>${T('total')}</span><span>${money(t.total)}</span></div></div>
 <br><button class="btn b-wa b-full" onclick="placeOrder()">${T('place')} ✔</button></div></section>`}
function keep(){['cn','cm','ca','car','cp','cno'].forEach(k=>{const e=document.getElementById(k);if(e)co[k]=e.value})}
function afterCheckout(){['cn','cm','ca','car','cp','cno'].forEach(k=>{const e=document.getElementById(k);if(e&&co[k])e.value=co[k]})}
function placeOrder(){
 const v=k=>(document.getElementById(k)||{value:''}).value.trim();
 const name=v('cn'),mob=v('cm'),addr=v('ca'),area=v('car'),pin=v('cp'),note=v('cno');
 if(!name||!/^[6-9]\d{9}$/.test(mob)){toast(L('नाम और सही 10 अंक का मोबाइल डालें','Enter name and valid 10-digit mobile'));return}
 if(co.mode==='home'){if(!addr||!/^\d{6}$/.test(pin)){toast(L('पता और 6 अंक का PIN डालें','Enter address and 6-digit PIN'));return}
  const pins=S.settings.pins.split(',').map(s=>s.trim()).filter(Boolean);if(pins.length&&!pins.includes(pin)){toast(L('इस PIN पर डिलीवरी उपलब्ध नहीं है','Delivery not available at this PIN'));return}}
 if(needWA())return;
 const t=totals(co.mode);S.seq++;const no='SKS'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(S.seq).padStart(3,'0');
 const items=cart.map(i=>{const p=P(i.id);return{id:p.id,hi:p.hi,en:p.en,wt:p.wt,q:i.q,price:hasPrice(p)?+p.price:null}});
 const o={no,t:Date.now(),name,mob,mode:co.mode,addr,area,pin,note,pay:co.pay,items,sub:t.sub,d:t.d,total:t.total,status:'received'};
 S.orders.unshift(o);items.forEach(it=>{});save();
 let msg=`🛒 *${no}*\n*शिवा किराना स्टोर*\n\n👤 ${name}\n📞 ${mob}\n\n`;
 items.forEach((it,i)=>{msg+=`${i+1}. ${it.hi} (${it.en}) ${it.wt?it.wt+' ':''}x ${it.q} = ${it.price!=null?money(it.price*it.q):'भाव बताएं'}\n`});
 msg+=`\nSubtotal: ${money(t.sub)}\nDelivery: ${co.mode==='pick'||!t.d?'Free':money(t.d)}\n*Total: ${money(t.total)}*${t.unp?' (+ भाव बाकी)':''}\n\n`;
 msg+=co.mode==='home'?`🚚 Home Delivery\n📍 ${addr}, ${area} - ${pin}\n`:`🏪 Self-pickup\n`;
 msg+=`💳 ${co.pay==='cod'?'Cash on delivery':co.pay==='upi'?'UPI (pay & confirm)':'Confirm on WhatsApp'}\n`;if(note)msg+=`📝 ${note}\n`;
 cart=[];saveCart();co={mode:'home',pay:'whatsapp'};
 if(o.pay==='upi'&&S.settings.upi&&t.total>0){window.open(`upi://pay?pa=${encodeURIComponent(S.settings.upi)}&pn=${encodeURIComponent('Shiva Kirana Store')}&am=${t.total}&cu=INR&tn=${encodeURIComponent(no)}`,'_blank')}
 toast('✔ '+no);location.href=waLink(msg);setTimeout(()=>go('orders'),1200)}

let myMob=localStorage.getItem('sk_mob')||'';
function pOrders(){
 return `<section><div class="wrap"><h2 class="t">${T('orders')}</h2><label>${L('अपना मोबाइल नंबर डालें','Enter your mobile number')}</label><div style="display:flex;gap:8px"><input id="om" inputmode="numeric" maxlength="10" value="${esc(myMob)}"><button class="btn b-blue" onclick="myMob=document.getElementById('om').value.trim();localStorage.setItem('sk_mob',myMob);render()">${L('देखें','View')}</button></div><br>
 ${(()=>{const a=S.orders.filter(o=>myMob&&o.mob===myMob);if(!myMob)return '';if(!a.length)return `<p>${L('कोई ऑर्डर नहीं मिला (इस फोन पर)','No orders found (on this phone)')}</p>`;return a.map(o=>orderCard(o,false)).join('')})()}
 <div class="note">${L('यहां सिर्फ इसी फोन से किए गए ऑर्डर दिखते हैं। ज़्यादा जानकारी के लिए दुकान को कॉल करें।','Only orders placed from this phone show here. Call the store for more.')}</div></div></section>`}
function stLabel(k){const s=STATUS.find(x=>x[0]===k);return s?L(s[1],s[2]):k}
function orderCard(o,adm){return `<div class="box" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between"><b>${esc(o.no)}</b><span class="st">${stLabel(o.status)}</span></div>
 <div class="pe">${new Date(o.t).toLocaleString('en-IN')}${adm?' · '+esc(o.name)+' · '+esc(o.mob):''}</div>
 <div>${o.items.map(i=>esc(L(i.hi,i.en))+' x'+i.q).join(', ')}</div>
 <div><b>${money(o.total)}</b> · ${o.mode==='home'?T('deliv'):T('pick')}${adm&&o.mode==='home'?'<br>📍 '+esc(o.addr+', '+o.area+' - '+o.pin):''}${adm&&o.note?'<br>📝 '+esc(o.note):''}</div>
 ${adm?`<select onchange="setStatus('${o.no}',this.value)" style="margin-top:6px">${STATUS.map(s=>`<option value="${s[0]}" ${s[0]===o.status?'selected':''}>${s[1]} / ${s[2]}</option>`).join('')}</select>`:''}</div>`}

about:()=>`<section><div class="wrap prose"><h2 class="t">${T('about')}</h2><p>${L('शिवा किराना स्टोर आपके पड़ोस की भरोसेमंद दुकान है, जिसके मालिक शिवा कुमार हैं। हमारा वादा है - शुद्ध सामान, उचित दाम और हर समय आपकी सेवा।','Shiva Kirana Store is your trusted neighbourhood store, owned by Shiva Kumar. Our promise: pure goods, fair prices and service at all times.')}</p><p>${L('दाल, चावल, आटा, मसाले, तेल, घी, पूजा सामग्री, बच्चों का सामान और बहुत कुछ - सब एक ही जगह।','Pulses, rice, flour, spices, oil, ghee, puja items, baby products and much more - all in one place.')}</p></div></section>`,

 ${s.phone?`<a class="btn b-blue" href="tel:${esc(s.phone.replace(/\D/g,''))}">📞 ${T('call')}</a> `:''}<a class="btn b-wa" onclick="waGeneral()">💬 WhatsApp</a>
 ${s.address?`<br><br><iframe title="map" loading="lazy" style="width:100%;height:260px;border:0;border-radius:14px" src="https://maps.google.com/maps?q=${encodeURIComponent(s.address)}&output=embed"></iframe>`:''}</div></section>`},
delivery:()=>`<section><div class="wrap prose"><h2 class="t">${L('डिलीवरी पॉलिसी','Delivery Policy')}</h2><ul><li>${L('होम डिलीवरी केवल उन PIN code पर, जो दुकानदार ने चालू किए हैं।','Home delivery only at PIN codes enabled by the store.')}</li><li>${L('डिलीवरी चार्ज: ','Delivery charge: ')}${+S.settings.delivery?money(S.settings.delivery):L('ऑर्डर पर बताया जाएगा','confirmed on order')}${+S.settings.freeAbove?L(' (मुफ्त: ',' (free above ')+money(S.settings.freeAbove)+L(' से ऊपर)',')'):''}</li><li>${L('अनुमानित समय: ','Estimated time: ')}${esc(S.settings.eta)}</li><li>${L('खुद लेने आने पर कोई डिलीवरी चार्ज नहीं।','No charge for self-pickup.')}</li></ul></div></section>`,
refund:()=>`<section><div class="wrap prose"><h2 class="t">${L('रिटर्न और रिफंड पॉलिसी','Return & Refund Policy')}</h2><ul><li>${L('गलत, खराब या एक्सपायर सामान मिलने पर डिलीवरी के समय या उसी दिन दुकान को बताएं।','If you receive wrong, damaged or expired items, tell the store at delivery or the same day.')}</li><li>${L('सामान बदला जाएगा या रकम वापस होगी।','Item will be replaced or amount refunded.')}</li><li>${L('खुले हुए खाने-पीने, पर्सनल केयर और फ्रोजन सामान की वापसी सिर्फ खराबी होने पर।','Opened food, personal care and frozen items are returnable only if defective.')}</li></ul></div></section>`,
privacy:()=>`<section><div class="wrap prose"><h2 class="t">${L('प्राइवेसी पॉलिसी','Privacy Policy')}</h2><ul><li>${L('हम केवल ऑर्डर पूरा करने के लिए आपका नाम, मोबाइल और पता लेते हैं।','We collect name, mobile and address only to fulfil your order.')}</li><li>${L('आपकी जानकारी किसी तीसरे को बेची नहीं जाती।','Your data is never sold to third parties.')}</li><li>${L('हम आपका UPI PIN या कार्ड की जानकारी कभी नहीं मांगते या रखते।','We never ask for or store your UPI PIN or card details.')}</li></ul></div></section>`,
terms:()=>`<section><div class="wrap prose"><h2 class="t">${L('नियम और शर्तें','Terms & Conditions')}</h2><ul><li>${L('सामान की उपलब्धता और भाव बदल सकते हैं।','Availability and prices may change.')}</li><li>${L('ऑर्डर दुकानदार की पुष्टि के बाद ही पक्का माना जाएगा।','An order is final only after the owner confirms it.')}</li><li>${L('स्वास्थ्य श्रेणी में केवल कानूनी रूप से बिकने वाला सामान है। प्रिस्क्रिप्शन दवाइयां केवल सक्षम अनुमति और लागू कानून के अनुसार ही बेची जाती हैं।','Health category has only legally saleable items. Prescription medicines are sold only with proper authorisation and as per applicable law.')}</li></ul></div></section>`
};

/* ================= ADMIN ================= */
let aTab='products',aEdit=null,authed=sessionStorage.getItem('sk_auth')==='1';
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sk:'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function login(){const p=document.getElementById('ap').value;if(p.length<6){toast('कम से कम 6 अक्षर / min 6 chars');return}
 const h=await hash(p);if(!S.adminHash){S.adminHash=h;save()}else if(S.adminHash!==h){toast('गलत पासवर्ड / Wrong password');return}
 authed=true;sessionStorage.setItem('sk_auth','1');render()}
function logout(){authed=false;sessionStorage.removeItem('sk_auth');render()}
function pAdmin(){
 if(!authed)return `<section><div class="wrap"><h2 class="t">${T('admin')}</h2><div class="box"><h3>${S.adminHash?'🔐 Login':'🔐 '+L('पहली बार: पासवर्ड बनाएं','First time: create password')}</h3><label>Password</label><input id="ap" type="password" autocomplete="current-password"><br><br><button class="btn b-red b-full" onclick="login()">OK</button></div></div></section>`;
 const tabs=[['products','📦 '+L('सामान','Products')],['orders','🧾 '+L('ऑर्डर','Orders')],['cats','🗂 '+L('श्रेणी','Categories')],['settings','⚙ '+L('सेटिंग','Settings')],['report','📊 '+L('रिपोर्ट','Reports')]];
 return `<section><div class="wrap"><h2 class="t">${T('admin')} <button class="btn b-out b-sm" onclick="logout()">Logout</button></h2><div class="tabs">${tabs.map(t=>`<button class="${aTab===t[0]?'on':''}" onclick="aTab='${t[0]}';aEdit=null;render()">${t[1]}</button>`).join('')}</div>${aTabs[aTab]()}</div></section>`}
const aTabs={
products(){
 if(aEdit!==null){const p=aEdit==='new'?{id:'',cat:S.cats[0]?S.cats[0].id:'',hi:'',en:'',brand:'',wt:'',price:'',mrp:'',stock:true,on:true,desc:'',img:''}:P(aEdit);
  return `<div class="box"><h3>${aEdit==='new'?'➕ '+L('नया सामान','New product'):'✏ '+L('सामान बदलें','Edit product')}</h3>
  <label>नाम (हिंदी)</label><input id="e_hi" value="${esc(p.hi)}"><label>Name (English)</label><input id="e_en" value="${esc(p.en)}">
  <label>${L('श्रेणी','Category')}</label><select id="e_cat">${S.cats.map(c=>`<option value="${c.id}" ${c.id===p.cat?'selected':''}>${esc(c.hi)} / ${esc(c.en)}</option>`).join('')}</select>
  <div class="two"><div><label>Brand</label><input id="e_brand" value="${esc(p.brand)}"></div><div><label>${L('वज़न/मात्रा','Weight/Qty')}</label><input id="e_wt" value="${esc(p.wt)}" placeholder="1 kg"></div></div>
  <div class="two"><div><label>${L('बिक्री भाव ₹','Selling price ₹')}</label><input id="e_price" type="number" step="any" inputmode="decimal" value="${p.price==null?'':p.price}"></div><div><label>MRP ₹</label><input id="e_mrp" type="number" step="any" inputmode="decimal" value="${p.mrp==null?'':p.mrp}"></div></div>
  <label>${L('विवरण','Description')}</label><textarea id="e_desc" rows="2">${esc(p.desc)}</textarea>
  <label>${L('फोटो','Photo')}</label><input type="file" accept="image/*" onchange="upImg(this)"><div id="e_prev">${p.img?`<img src="${esc(p.img)}" style="width:90px;margin-top:6px;border-radius:10px">`:''}</div><input type="hidden" id="e_img" value="${esc(p.img)}">
  <label><input type="checkbox" id="e_stock" style="width:auto" ${p.stock?'checked':''}> ${L('स्टॉक में है','In stock')}</label><label><input type="checkbox" id="e_on" style="width:auto" ${p.on?'checked':''}> ${L('दुकान में दिखाएं','Show in store')}</label>
  <label><input type="checkbox" id="e_feat" style="width:auto" ${p.feat?'checked':''}> ${L('खास सामान','Featured')}</label><label><input type="checkbox" id="e_best" style="width:auto" ${p.best?'checked':''}> ${L('सबसे ज़्यादा बिकने वाला','Best seller')}</label>
  <br><button class="btn b-red" onclick="saveProd('${aEdit}')">💾 Save</button> <button class="btn b-out" onclick="aEdit=null;render()">Cancel</button></div>`}
 return `<button class="btn b-gold b-full" onclick="aEdit='new';render()">➕ ${L('नया सामान जोड़ें','Add new product')}</button><br><input placeholder="${L('खोजें','Search')}" oninput="aq=this.value;renderList()" id="aqi" value="${esc(aq)}"><br><br><div id="alist">${aList()}</div>`},
orders(){return S.orders.length?S.orders.map(o=>orderCard(o,true)).join(''):`<p>${L('अभी कोई ऑर्डर नहीं','No orders yet')}</p>`},
cats(){return `<div class="box"><h3>➕ ${L('नई श्रेणी','New category')}</h3><label>नाम (हिंदी)</label><input id="c_hi"><label>Name (English)</label><input id="c_en"><label>Emoji</label><input id="c_ic" value="📦" maxlength="4"><br><br><button class="btn b-red" onclick="addCat()">Add</button></div><br>${S.cats.map(c=>`<div class="row"><div class="th">${c.icon}</div><div class="m"><b>${esc(c.hi)}</b><div class="pe">${esc(c.en)} · ${S.products.filter(p=>p.cat===c.id).length}</div></div><button class="btn b-out b-sm" onclick="delCat('${c.id}')">🗑</button></div>`).join('')}`},
settings(){const s=S.settings;const f=(k,l,t='text',ph='')=>`<label>${l}</label><input id="s_${k}" type="${t}" value="${esc(s[k])}" placeholder="${ph}">`;
 return `<div class="box"><h3>⚙ ${L('दुकान की जानकारी','Store info')}</h3>${f('wa','WhatsApp (10 digit)','tel','9876543210')}${f('phone',L('फोन नंबर','Phone'),'tel')}${f('email','Email','email')}<label>${L('पता','Address')}</label><textarea id="s_address" rows="2">${esc(s.address)}</textarea>${f('hours',L('समय','Hours'))}
 ${f('delivery',L('डिलीवरी चार्ज ₹','Delivery charge ₹'),'number')}${f('freeAbove',L('इतने ₹ से ऊपर मुफ्त (0 = कभी नहीं)','Free above ₹ (0 = never)'),'number')}${f('pins',L('डिलीवरी PIN codes (कॉमा से अलग, खाली = सब)','Delivery PINs (comma separated, empty = all)'))}${f('eta',L('अनुमानित डिलीवरी समय','Estimated delivery time'))}${f('upi','UPI ID','text','name@bank')}
 <label><input type="checkbox" id="s_cod" style="width:auto" ${s.cod?'checked':''}> ${L('कैश ऑन डिलीवरी चालू','Enable cash on delivery')}</label><br><button class="btn b-red b-full" onclick="saveSet()">💾 Save</button></div>
 <br><div class="box"><h3>💾 Backup</h3><button class="btn b-blue b-sm" onclick="backup()">⬇ Download</button> <label class="btn b-out b-sm" style="margin:0">⬆ Restore<input type="file" accept=".json" style="display:none" onchange="restore(this)"></label><div class="pe" style="margin-top:6px">${L('डेटा इसी फोन/ब्राउज़र में सेव होता है, इसलिए बैकअप ज़रूर लें।','Data is saved in this phone/browser, so take backups regularly.')}</div></div>`},
report(){const ok=S.orders.filter(o=>o.status!=='cancelled'),dl=S.orders.filter(o=>o.status==='delivered');const sum=a=>a.reduce((x,o)=>x+o.total,0);
 return `<div class="sum"><div><span>${L('कुल ऑर्डर','Total orders')}</span><b>${S.orders.length}</b></div><div><span>${L('डिलीवर हुए','Delivered')}</span><b>${dl.length}</b></div><div><span>${L('कुल बिक्री (रद्द छोड़कर)','Sales (excl. cancelled)')}</span><b>${money(sum(ok))}</b></div><div><span>${L('डिलीवर हुई बिक्री','Delivered sales')}</span><b>${money(sum(dl))}</b></div></div><br>${STATUS.map(s=>`<div class="row"><b>${s[1]}</b><span class="sp"></span>${S.orders.filter(o=>o.status===s[0]).length}</div>`).join('')}`}
};
let aq='';
function aList(){const s=aq.toLowerCase();return S.products.filter(p=>!s||(p.hi+p.en+p.brand).toLowerCase().includes(s)).slice(0,60).map(p=>`<div class="row" style="flex-wrap:wrap"><div class="th">${p.img?`<img src="${esc(p.img)}">`:C(p.cat).icon}</div><div class="m"><b>${esc(p.hi)}</b><div class="pe">${esc(p.en)} · ${hasPrice(p)?money(p.price):'—'} · ${p.stock?'✔':'✖'} · ${p.on?'👁':'🚫'}</div></div>
 <div style="display:flex;gap:6px"><button class="btn b-blue b-sm" onclick="aEdit='${p.id}';render()">✏</button><button class="btn b-out b-sm" onclick="quick('${p.id}','stock')">${p.stock?L('स्टॉक खत्म','Out'):L('स्टॉक में','In')}</button><button class="btn b-out b-sm" onclick="quick('${p.id}','on')">${p.on?'🚫':'👁'}</button><button class="btn b-out b-sm" onclick="delProd('${p.id}')">🗑</button></div></div>`).join('')+(S.products.length>60?`<p class="pe">${L('ऊपर खोज से और सामान ढूंढें','Use search to find more')}</p>`:'')}
function renderList(){document.getElementById('alist').innerHTML=aList()}
function quick(id,k){const p=P(id);p[k]=!p[k];save();renderList()}
function delProd(id){if(confirm(L('हटाएं?','Delete?'))){S.products=S.products.filter(p=>p.id!==id);cart=cart.filter(i=>i.id!==id);save();saveCart();renderList()}}
function upImg(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const m=480,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',.75);document.getElementById('e_img').value=d;document.getElementById('e_prev').innerHTML=`<img src="${d}" style="width:90px;margin-top:6px;border-radius:10px">`};im.src=r.result};r.readAsDataURL(f)}
function saveProd(id){const g=k=>document.getElementById('e_'+k),n=v=>v===''?null:+v;
 const hi=g('hi').value.trim(),en=g('en').value.trim();if(!hi&&!en){toast('नाम डालें / Enter name');return}
 const d={hi:hi||en,en:en||hi,cat:g('cat').value,brand:g('brand').value.trim(),wt:g('wt').value.trim(),price:n(g('price').value),mrp:n(g('mrp').value),desc:g('desc').value.trim(),img:g('img').value,stock:g('stock').checked,on:g('on').checked,feat:g('feat').checked,best:g('best').checked};
 if(id==='new'){S.products.unshift(Object.assign({id:'p'+Date.now(),isnew:true,t:Date.now()},d))}else Object.assign(P(id),d);
 save();aEdit=null;toast('✔ Saved');render()}
function addCat(){const hi=document.getElementById('c_hi').value.trim(),en=document.getElementById('c_en').value.trim()||hi;if(!hi)return;S.cats.push({id:'c'+Date.now(),hi,en,icon:document.getElementById('c_ic').value||'📦'});save();render()}
function delCat(id){if(S.products.some(p=>p.cat===id)){toast(L('पहले इस श्रेणी का सामान हटाएं','Remove its products first'));return}S.cats=S.cats.filter(c=>c.id!==id);save();render()}
function setStatus(no,st){const o=S.orders.find(x=>x.no===no);o.status=st;save();toast('✔')}
function saveSet(){const s=S.settings;['wa','phone','email','address','hours','delivery','freeAbove','pins','eta','upi'].forEach(k=>{const v=document.getElementById('s_'+k).value.trim();s[k]=(k==='delivery'||k==='freeAbove')?(+v||0):v});s.cod=document.getElementById('s_cod').checked;save();toast('✔ Saved');renderChrome()}
function backup(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='shiva-kirana-backup.json';a.click()}
function restore(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.products)throw 0;S=d;save();toast('✔ Restored');render()}catch(e){toast('Invalid file')}})}

/* ================= CHROME / RENDER ================= */
function renderChrome(){
 document.getElementById('bn').textContent=T('name');document.getElementById('bt').textContent=T('tag');document.getElementById('lb').textContent=lang==='hi'?'EN':'हिं';
 document.getElementById('q').placeholder=T('search').replace('🔍 ','');
 const m=[['home','home'],['shop','shop'],['cats','cats'],['orders','orders'],['about','about'],['contact','contact']];
 document.getElementById('menu').innerHTML=m.map(x=>`<a href="#${x[0]}" class="${route[0]===x[0]?'on':''}">${T(x[1])}</a>`).join('');
 const s=S.settings,ph=(s.phone||'').replace(/\D/g,'');
 document.getElementById('bar').innerHTML=(ph?`<a class="btn b-blue b-sm" href="tel:${ph}">📞 ${T('call')}</a>`:'')+`<a class="btn b-wa b-sm" onclick="waGeneral()">💬 WhatsApp</a><a class="btn b-red b-sm" onclick="go('cart')">🛒 ${T('cart')}</a>`;
 document.getElementById('foot').innerHTML=`<div class="info"><div><h3>शिवा किराना स्टोर</h3><p>${T('tag')}</p><p>Shiva Kumar</p><p>📍 ${esc(s.address)||''}</p><p>📞 ${esc(s.phone)||''}</p><p>🕒 ${esc(s.hours)}</p></div>
 <div><h3>${L('जानकारी','Info')}</h3><a href="#delivery">${L('डिलीवरी पॉलिसी','Delivery Policy')}</a><a href="#refund">${L('रिटर्न और रिफंड','Return & Refund')}</a><a href="#privacy">${L('प्राइवेसी पॉलिसी','Privacy Policy')}</a><a href="#terms">${L('नियम और शर्तें','Terms & Conditions')}</a><a href="#admin">🔐 ${T('admin')}</a></div></div>
 <div class="built">built with ❤️ by 21.coders</div>`}
function render(){
 const h=(location.hash||'#home').slice(1).split('/');route=h;saveCart();
 const r=h[0];let html;
 if(r==='home')html=pHome();else if(r==='shop')html=pShop();else if(r==='cats')html=pCats();else if(r==='product')html=pProd(h[1]);else if(r==='cart')html=pCart();else if(r==='checkout')html=pCheckout();else if(r==='orders')html=pOrders();else if(r==='admin')html=pAdmin();else if(PAGES[r])html=PAGES[r]();else html=pHome();
 document.getElementById('app').innerHTML=html;renderChrome();
 if(r==='checkout')afterCheckout();
 if(r!=='admin'&&r!=='checkout')window.scrollTo(0,0);
 document.title=T('name')+' | '+(lang==='hi'?'Shiva Kirana Store':'शिवा किराना स्टोर');document.documentElement.lang=lang;
}
saveCart();render();
</script>
